<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dispatch — JeevanKey</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#101720;--paper:#fff;--field:#f4f6f8;--line:#d9dfe6;--muted:#5d6b7a;--navy:#0C447C;--amber:#B26A00;--red:#A31D1D;--ok:#1F6B4A}
*{box-sizing:border-box}
body{margin:0;background:#eef1f4;color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:16px 14px 60px}
.masthead{background:var(--navy);color:#fff;padding:14px 16px;border-radius:4px}
.masthead h1{font-size:16px;margin:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:16px;margin-top:12px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px}
input{width:100%;font-family:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:3px;background:var(--field)}
button{font-family:inherit;font-size:14px;font-weight:600;padding:10px 16px;border-radius:3px;border:1px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer}
button.ghost{background:#fff;color:var(--navy)}
.gate{max-width:340px;margin:60px auto;text-align:center}

table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px}
th{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.ref{font-family:'IBM Plex Mono',monospace;font-weight:600}
.dot{display:inline-block;width:22px;height:22px;border-radius:50%;text-align:center;line-height:22px;font-size:12px;font-weight:700}
.dot.on{background:#e0f0e8;color:var(--ok)}
.dot.off{background:#f2e3e3;color:var(--red)}
.n{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}
.mkbtn{padding:6px 12px;font-size:13px}

/* printable sheet — matches the A4 report paper.
   Top ~34% (up to ~290pt of 842) is left BLANK: on the physical report stock
   that zone holds the QR, barcode, and patient detail box. This page prints
   as a separate A4 sheet appended to the report, same stock, same identity. */
#sheet{margin-top:16px}
.psheet{background:#fff;color:#000;font-family:Helvetica,Arial,sans-serif;font-size:11px;line-height:1.45;
  width:210mm;margin:0 auto;padding:0;position:relative}
.psheet .reserved{height:62mm}         /* reduced — aligns just above where report values start */
.psheet .body{padding:0 14mm 8mm}
.psheet.page2 .reserved{height:62mm}   /* same on page 2 for identical alignment */

.psheet .pointer{border:1.5px solid #000;background:#fff;padding:9px 12px;margin:12px 0;font-size:10.5px;line-height:1.5;text-align:center}
.psheet .mini-coupon{border:1px dashed #000;padding:8px 11px;margin:12px 0;font-size:10px;line-height:1.5;text-align:center}
.psheet .mini-coupon .mc-code{font-family:'Courier New',monospace;font-weight:700;font-size:12px}
.psheet .mini-coupon .mc-off{font-size:9.5px}
.psheet .mini-coupon s{color:#555}

.psheet .pcard{border:1px solid #000;padding:8px 10px;margin-bottom:7px}
.psheet .pc-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.psheet .pc-n{font-weight:700;font-size:12px;letter-spacing:.03em}
.psheet .pc-tag{font-size:7.5px;background:#000;color:#fff;padding:1px 5px;border-radius:2px;letter-spacing:.03em}
.psheet .pc-p{margin-left:auto;font-size:15px;font-weight:700}
.psheet .pc-p small{font-size:9px;font-weight:400}
.psheet .pc-doc{font-size:9.5px;margin:2px 0 4px;padding:2px 0;border-bottom:1px dotted #999}
.psheet .pc-list{margin:0;padding-left:15px;font-size:9px;line-height:1.4}
.psheet .pc-list li{margin-bottom:2px}

.psheet .withdoc2{border-left:3px solid #000;padding:7px 10px;margin:8px 0;font-size:9.5px;line-height:1.5;background:#f7f7f7}
.psheet .hiring{border:1px solid #000;padding:8px 11px;margin:8px 0;font-size:10px;line-height:1.5}
.psheet .refund .hl{background:#ffe;font-weight:700;padding:0 2px;box-shadow:inset 0 -6px 0 #f4e9a8}
.psheet .title{text-align:center;font-weight:700;font-size:12px;text-decoration:underline;
  letter-spacing:.02em;margin:0 0 4px}
.psheet .subtitle{text-align:center;font-size:10px;margin:0 0 12px;color:#222}
.psheet .box{border:1px solid #000;padding:7px 10px;font-size:10.5px;
  display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;margin-bottom:14px}
.psheet h3{font-size:11px;font-weight:700;margin:14px 0 5px;border-bottom:1px solid #000;padding-bottom:3px}
.psheet ul{margin:0;padding-left:16px}.psheet li{margin-bottom:4px}
.psheet .val{font-weight:700}
.flag{border:1px solid #000;padding:8px 11px;margin:12px 0;font-weight:700;font-size:11px}
.psheet .offer{border:1.5px solid #000;padding:11px 13px;margin-top:16px}
.psheet .offer-hd{font-weight:700;font-size:12px;text-align:center;margin-bottom:5px}
.psheet .offer-why{font-size:10px;line-height:1.5;text-align:center;margin-bottom:9px}
.psheet .oc-t{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.psheet .oc-p{font-size:16px;font-weight:700;line-height:1.2}
.psheet .oc-p s{font-weight:400;font-size:12px;color:#555}
.psheet .oc-d{font-size:9px;line-height:1.35;margin-top:3px}
.psheet .code{font-family:'Courier New',monospace;font-size:16px;font-weight:700;letter-spacing:.05em;text-align:center;margin:2px 0}
.psheet .coupon-label{text-align:center;font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#555;margin-top:8px}
.psheet .howto{font-size:9.5px;line-height:1.5;margin:6px 0;padding:7px 9px;border:1px dotted #000;background:#fafafa}
.psheet .web{font-weight:700;text-align:center;font-size:11px}

/* ---- back page ---- */
.psheet.page2{page-break-before:always;margin-top:26px}
.psheet.page2 .body{padding:20mm 14mm 12mm}
.psheet .p2{font-size:10.5px;line-height:1.55;margin:0 0 4px}
.psheet .small{font-size:9.5px;color:#333}
.psheet .t2{width:100%;border-collapse:collapse;margin:4px 0 10px;font-size:10px}
.psheet .t2 td{border-bottom:1px solid #ccc;padding:5px 4px;vertical-align:top;line-height:1.45}
.psheet .t2 td.k{font-weight:700;width:32%;white-space:nowrap}
.psheet .plans{display:grid;grid-template-columns:1fr 1fr 1fr;border:1px solid #000;margin:10px 0 6px}
.psheet .pl{padding:8px 7px;text-align:center;border-right:1px solid #000}
.psheet .pl:last-child{border-right:none}
.psheet .pl-n{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.psheet .pl-tag{display:inline-block;font-size:7px;background:#000;color:#fff;padding:1px 4px;border-radius:2px;letter-spacing:.04em;vertical-align:middle}
.psheet .pl-p{font-size:15px;font-weight:700;line-height:1.15}
.psheet .pl-d{font-size:8.5px}
.psheet .pl-x{font-size:8px;line-height:1.35;margin-top:4px;text-align:left;color:#222}
.psheet .refund{border:1px solid #000;padding:8px 11px;margin:8px 0;font-size:9.5px;line-height:1.55;background:#f4f4f4}
.psheet .cta2{border:1.5px solid #000;padding:11px;text-align:center;margin-top:14px}
.psheet .cta2-t{font-weight:700;font-size:12px}
.psheet .withdoc{border-left:3px solid #000;padding:8px 11px;margin:10px 0;font-size:10.5px;line-height:1.55;background:#f7f7f7}
.psheet .offer-grid2{display:grid;grid-template-columns:1fr 1fr;border:1px solid #000;margin:4px 0 10px}
.psheet .og-col{padding:9px;text-align:center}
.psheet .og-col:first-child{border-right:1px solid #000}
.psheet .og-t{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em}
.psheet .og-p{font-size:17px;font-weight:700;line-height:1.2;margin:2px 0}
.psheet .og-p s{font-weight:400;font-size:12px;color:#555}
.psheet .og-p .pm{font-size:10px;font-weight:400}
.psheet .og-d{font-size:9px;line-height:1.35}
.psheet .howto2{font-size:9.5px;line-height:1.5;margin:7px 0;padding:7px 9px;border:1px dotted #000;background:#fafafa;text-align:left}
.psheet .revline{margin-top:18px;padding-top:8px;border-top:1px solid #000;font-size:10px}
.psheet .disc{font-size:9px;color:#333;margin-top:6px}
.gen{font-size:9px;color:#888;font-style:italic;font-weight:400}

@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff;height:auto;margin:0;padding:0}
  .noprint{display:none!important}
  .wrap{padding:0;margin:0;max-width:none}
  #sheet{margin:0}
  .psheet{width:210mm;min-height:auto;height:auto;margin:0;page-break-inside:avoid}
  .psheet.page2{page-break-before:always;margin-top:0}
  .psheet:last-child{page-break-after:avoid}
  .psheet .body>*:last-child{margin-bottom:0}
}
</style>
</head>
<body>
<div class="wrap">

<div id="gate" class="gate">
  <div class="masthead"><h1>JeevanKey — Dispatch</h1></div>
  <div class="card">
    <label for="pass">Passcode</label>
    <input id="pass" type="password">
    <button style="margin-top:12px;width:100%" onclick="unlock()">Open</button>
    <p id="gerr" style="color:var(--red);font-size:13px"></p>
  </div>
</div>

<div id="app" style="display:none">
  <div class="masthead noprint"><h1>Dispatch board — today</h1></div>

  <div class="card noprint">
    <label>Add ref numbers to check (comma-separated), or leave blank for today's submitted refs</label>
    <div style="display:flex;gap:8px">
      <input id="refs" placeholder="2607133031, 2607131794">
      <button onclick="loadBoard()" style="flex:none">Refresh</button>
    </div>
    <table id="board"><thead><tr><th>Ref</th><th>Doctor</th><th>Dietician</th><th>Yoga</th><th>Status</th><th></th></tr></thead><tbody></tbody></table>
  </div>

  <div id="sheet"></div>
</div>
</div>

<script>
var API_URL='https://script.google.com/macros/s/AKfycbytFY4Kq1oFdJ0rkRMKVQMz7PEp_yAoOUq6wD_QvZrfEfdO0jhU0RSywBNVkbfkXh0/exec';
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s||'').replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})};
var PASS='';

/* generic fallbacks when a role hasn't reviewed — NO name attached.
   Note: there is deliberately NO generic "chinta ki baat nahi" — that line
   only appears when a doctor actually reviewed. */
var GENERIC={
  questions:['Yeh values kis wajah se aisi hain?','Kya aur koi jaanch zaroori hai?','Agli baar poori jaanch kab karwani chahiye?'],
  diet:'Santulit khana khayein — sabziyan, dal, saabut anaj. Zyada tala-bhuna aur meetha kam karein. Paani theek matra mein piyein.',
  yoga:'Roz thodi walking ya halki stretching karein. Neend poori lein. Koi bhi bhaari abhyas shuru karne se pehle apne doctor se poochh lein.'
};

function unlock(){
  PASS=$('pass').value.trim();
  if(!PASS){$('gerr').textContent='Enter passcode.';return}
  $('gate').style.display='none';$('app').style.display='block';
  loadBoard();
}

function loadBoard(){
  fetch(API_URL+'?action=status&pass='+encodeURIComponent(PASS))
    .then(function(r){return r.json()}).then(function(res){
      if(!res.ok){alert('Error: '+res.error);return}
      var refs=Object.keys(res.status||{});
      var typed=$('refs').value.split(',').map(function(s){return s.trim()}).filter(Boolean);
      typed.forEach(function(r){if(refs.indexOf(r)<0)refs.push(r)});
      var tb=$('board').querySelector('tbody');tb.innerHTML='';
      if(!refs.length){tb.innerHTML='<tr><td colspan="6" class="n">No reviews submitted today yet.</td></tr>';return}
      refs.forEach(function(ref){
        var s=res.status[ref]||{doctor:false,dietician:false,yoga:false};
        var done=[s.doctor,s.dietician,s.yoga].filter(Boolean).length;
        var label=done===3?'Complete':done===0?'None — dispatch plain':done+' of 3';
        tb.innerHTML+='<tr><td class="ref">'+esc(ref)+'</td>'
          +cell(s.doctor)+cell(s.dietician)+cell(s.yoga)
          +'<td class="n">'+label+'</td>'
          +'<td>'+(done>0?'<button class="mkbtn" onclick="makeSheet(\''+esc(ref)+'\')">Make sheet</button>':'')+'</td></tr>';
      });
    }).catch(function(){alert('Network error.')});
}
function cell(on){return '<td><span class="dot '+(on?'on':'off')+'">'+(on?'✓':'–')+'</span></td>'}

function makeSheet(ref){
  fetch(API_URL+'?action=getReviews&ref='+encodeURIComponent(ref)+'&pass='+encodeURIComponent(PASS))
    .then(function(r){return r.json()}).then(function(res){
      if(!res.ok){alert('Error: '+res.error);return}
      renderSheet(res.report||{}, res.reviews||{});
    });
}

function renderSheet(rep, rv){
  var doc=rv.doctor?rv.doctor.data:null;
  var die=rv.dietician?rv.dietician.data:null;
  var yog=rv.yoga?rv.yoga.data:null;

  var flag='';
  if(doc && doc.triage==='priority')
    flag='<div class="flag">Yeh report '+esc(doc.window)+' din ke andar apne doctor ko dikhana zaroori hai.</div>';

  var pr = doc && doc.primary && doc.primary.length
    ? '<h3>Sabse zaroori</h3><ul>'+doc.primary.map(function(p){return '<li><span class="val">'+esc(p[0])+'</span>'+(p[1]?' — '+esc(p[1]):'')+'</li>'}).join('')+'</ul>' : '';
  var se = doc && doc.secondary && doc.secondary.length
    ? '<h3>Dhyan rakhne wali</h3><ul>'+doc.secondary.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ul>' : '';

  /* "chinta ki baat nahi" ONLY when a doctor actually reviewed. No generic version. */
  var normalBlock = (doc && doc.normal)
    ? '<h3>Chinta ki baat nahi</h3><p>'+esc(doc.normal)+'</p>' : '';

  /* questions: doctor's if present, else general */
  var qs = (doc && doc.questions && doc.questions.length) ? doc.questions : GENERIC.questions;
  var qGen = !(doc && doc.questions && doc.questions.length);
  var qHtml='<h3>Apne doctor se poochhein '+(qGen?'<span class="gen">(general)</span>':'')+'</h3><ul>'
    +qs.map(function(q){return '<li>'+esc(q)+'</li>'}).join('')+'</ul>';

  var dietTxt = die && die.diet ? die.diet : GENERIC.diet;
  var dietGen = !(die && die.diet);
  var yogaTxt = yog && yog.yoga ? yog.yoga : GENERIC.yoga;
  var yogaGen = !(yog && yog.yoga);

  /* reviewer names, matching Immuno report footer style: "Name" on its own line */
  /* reviewer names WITH role, matching Immuno report footer style */
  var names=[];
  if(rv.doctor && rv.doctor.reviewer) names.push(esc(rv.doctor.reviewer)+' (Doctor)');
  if(rv.dietician && rv.dietician.reviewer) names.push(esc(rv.dietician.reviewer)+' (Dietician)');
  if(rv.yoga && rv.yoga.reviewer) names.push(esc(rv.yoga.reviewer)+' (Yoga Therapist)');

  var labFull = rep.Lab || '';   /* full "Sample From" name, e.g. S.B PATHOLOGY LAB */
  var coupon = rep.Coupon || ('JK-'+String(rep.Ref||'').slice(-4));

  $('sheet').innerHTML=
   '<div class="noprint" style="text-align:center;margin:16px 0"><button onclick="window.print()">Print / Save PDF</button>'
   +'<span style="margin-left:12px;color:var(--muted);font-size:13px">Prints as 2 A4 pages on report stock. In print dialog, uncheck "Headers and footers".</span></div>'

   /* ================= PAGE 1 — clinical, self-sufficient ================= */
   +'<div class="psheet"><div class="reserved"></div><div class="body">'
   +'<div class="title">'+esc(labFull)+' KI TARAF SE</div>'
   +'<div class="subtitle">Aapki report — aasan bhasha mein, JeevanKey ke ek doctor aur 2 health experts ne samjhaayi</div>'
   +'<div class="box">'
   +'<div>Ref No. : '+esc(rep.Ref||'')+'</div><div>Age/Sex : '+esc(rep.Age||'')+' / '+esc(rep.Sex||'')+'</div>'
   +'<div>Profile : '+esc(rep.Profile||'')+'</div><div>Lab : '+esc(labFull)+'</div>'
   +'<div style="grid-column:1/-1">Name : '+esc(rep.Patient||'')+'</div></div>'
   +flag+pr+se+normalBlock+qHtml

   /* why-explained (clinical framing, no offer) */
   +'<div class="offer">'
   +'<div class="offer-hd">Report samajhna zaroori hai — sirf number dekhna kaafi nahi</div>'
   +'<div class="offer-why">'
   +'Google par har value ka matlab alag milta hai, aur darr zyada. '
   +'Isiliye is report ko JeevanKey ke ek doctor aur 2 health experts ne milkar dekha aur aasan bhasha mein '
   +'samjhaaya hai — taaki aap apne doctor se sahi baat kar sakein.'
   +'</div></div>'

   /* THE ENFORCER: points to page 2, promises something the patient wants */
   +'<div class="pointer">'
   +'Aapki report ke hisaab se <b>khane mein kya badlein</b> aur <b>rozana kya karein</b> — '
   +'iska plan JeevanKey ke Dietician aur Yoga Therapist ne banaya hai, '
   +'is report ke <b>ANTIM PANNE (last page)</b> par. Zaroor dekhein.'
   +'</div>'

   /* doctor-trust box, moved up from page 2 */
   +'<div class="withdoc">'
   +'<b>Aapke apne doctor ke saath.</b> JeevanKey ki health team aapke doctor ki hi salah ko follow karne mein '
   +'madad karti hai — unke against nahi. <b>Agar aapka koi doctor nahi hai, toh hum ek doctor bhi dete hain</b>, '
   +'poori health team ke saath.'
   +'</div>'

   /* minimal failsafe coupon — works even if page 2 is dropped */
   +'<div class="mini-coupon">'
   +'<b>Report ke baare mein baat karni hai?</b> '
   +'WhatsApp <b>97600 15878</b> par yeh code bhejein: <span class="mc-code">'+esc(coupon)+'</span><br>'
   +'<span class="mc-off">Pehle 100 logon ke liye <s>₹999</s> <b>₹499</b> — ek doctor + ek health expert se poori consultation. '
   +'Poori jaankari antim panne par.</span>'
   +'</div>'

   +'<div class="revline">'+(names.length?'Review by: '+names.join(' &nbsp; ')+'':'')+'</div>'
   +'<div class="disc">Yeh diagnosis nahi hai. Ilaaj ka faisla hamesha aapke doctor ka hoga. '
   +'JeevanKey ke medical experts ek independent clinical review team ki tarah kaam karte hain, '
   +'kisi bhi dawai ya diagnostic lab se swatantra. Aapki jaankari private rehti hai.</div>'
   +'</div></div>'

   /* ================= PAGE 2 — experts\' work + full offer ================= */
   +'<div class="psheet page2"><div class="reserved"></div><div class="body">'
   +'<div class="title">'+esc(labFull)+' — AAPKA HEALTH PLAN</div>'

   /* the diet/yoga reviews — now the reason page 2 is missed if dropped */
   +'<h3>Khane mein '+(dietGen?'<span class="gen">(general)</span>':'')+'</h3><p class="p2">'+esc(dietTxt)+'</p>'
   +'<h3>Dincharya mein '+(yogaGen?'<span class="gen">(general)</span>':'')+'</h3><p class="p2">'+esc(yogaTxt)+'</p>'

   +'<h3>Ek report se pata chalta hai — badalta nahi</h3>'
   +'<p class="p2">Values ek din mein nahi bantin. Jo cheezein farak laati hain — khana, neend, tanaav, '
   +'dincharya, aur dawai ka sahi asar — unme <b>2 se 3 mahine</b> lagte hain. '
   +'Us poore samay koi aapke saath ho, yahi JeevanKey ka kaam hai.</p>'

   +'<h3>Kya milta hai monthly plan mein</h3>'

   +'<div class="pcard">'
   +'<div class="pc-top"><span class="pc-n">ESSENTIAL</span><span class="pc-tag">POPULAR · 20+</span>'
   +'<span class="pc-p">₹2,499<small>/mahina</small></span></div>'
   +'<div class="pc-doc">Apne doctor ke saath: <b>₹1,999/mahina</b></div>'
   +'<ul class="pc-list">'
   +'<li><b>Chhoti Expert Team:</b> JeevanKey Health Manager + ek Doctor (MBBS/GP, BAMS, ya BHMS) + ek Health Expert (Dietician, Physiotherapist, ya Wellness Coach)</li>'
   +'<li><b>WhatsApp Access:</b> mahine bhar jab chahein sawal poochein ya madad lein</li>'
   +'<li><b>Monthly Check-in:</b> mahine ke ant mein poori health ka clear assessment</li>'
   +'<li><b>Kiske liye:</b> 1–2 health concern par kaam kar rahe log (diet, energy, immunity, stress)</li>'
   +'</ul></div>'

   +'<div class="pcard">'
   +'<div class="pc-top"><span class="pc-n">PREMIUM</span><span class="pc-tag">POPULAR · 40+</span>'
   +'<span class="pc-p">₹4,499<small>/mahina</small></span></div>'
   +'<div class="pc-doc">Apne doctor ke saath: <b>₹3,499/mahina</b></div>'
   +'<ul class="pc-list">'
   +'<li><b>Poori Expert Team:</b> aapki problem ke hisaab se chune 3 bade experts (Doctor + MD Specialist/Gynaecologist, Dietician, Psychotherapist, Physiotherapist, ya Yoga Specialist)</li>'
   +'<li><b>Conflict Resolution:</b> experts ki salah alag ho toh JeevanKey aasan bhasha mein balance karke samjhaata hai</li>'
   +'<li><b>Test & Scan Assistance:</b> agli sahi jaanch aur scans connect karne mein poori madad</li>'

   +'</ul></div>'
