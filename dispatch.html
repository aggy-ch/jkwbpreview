<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dispatch</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#101720;--paper:#fff;--field:#f4f6f8;--line:#d9dfe6;--muted:#5d6b7a;--navy:#0C447C;--amber:#B26A00;--red:#A31D1D;--ok:#1F6B4A}
*{box-sizing:border-box}
body{margin:0;background:#eef1f4;color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:820px;margin:0 auto;padding:16px 14px 60px}
.masthead{background:var(--navy);color:#fff;padding:14px 16px;border-radius:4px}
.masthead h1{font-size:16px;margin:0}
.card{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:16px;margin-top:12px}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px}
input{width:100%;font-family:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:3px;background:var(--field)}
button{font-family:inherit;font-size:14px;font-weight:600;padding:10px 16px;border-radius:3px;border:1px solid var(--navy);background:var(--navy);color:#fff;cursor:pointer}
button.ghost{background:#fff;color:var(--navy)}
.gate{max-width:340px;margin:60px auto;text-align:center}

table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);font-size:14px}
th{font-family:'IBM Plex Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.ref{font-family:'IBM Plex Mono',monospace;font-weight:600}
.dot{display:inline-block;width:22px;height:22px;border-radius:50%;text-align:center;line-height:22px;font-size:12px;font-weight:700}
.dot.on{background:#e0f0e8;color:var(--ok)}
.dot.off{background:#f2e3e3;color:var(--red)}
.n{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}
.mkbtn{padding:6px 12px;font-size:13px}

/* ---- manual size control (screen only) ---- */
.fitbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 14px;margin:0 auto 12px;max-width:794px}
.fitbar .fl{font-size:13px;color:var(--muted)}
.fitbar .mono{font-family:'IBM Plex Mono',monospace}
.fitbar .fb{width:34px;flex:none;padding:6px 0;font-size:18px;line-height:1}
.fitbar .fb2{flex:none;padding:6px 12px;font-size:13px}
.fitbar input[type=range]{flex:1;min-width:130px;background:transparent}

/* ================= printable sheet — ONE A4 page =================
   Top 50mm is left BLANK: on the physical report stock that zone holds
   the QR, barcode, and patient detail box. This sheet prints on the same
   stock, appended to the report. Font size auto-fits to fill one page
   (see autoFitSheet), and can be nudged by hand with the control above. */
#sheet{margin-top:16px}
.psheet{background:#fff;color:#000;font-family:Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;
  width:210mm;margin:0 auto;position:relative;box-shadow:0 1px 6px rgba(0,0,0,.15)}
.psheet .reserved{height:50mm}
.psheet .body{padding:0 15mm 7mm}
.psheet .title{text-align:center;font-weight:700;font-size:1.28em;text-decoration:underline;letter-spacing:.02em;margin:0 0 .3em}
.psheet .subtitle{text-align:center;font-size:.92em;margin:0 0 .7em;color:#222}
.psheet .ident{border:1px solid #000;padding:.5em .8em;font-size:.98em;margin-bottom:.9em;text-align:center}
.psheet .flag{border:1.5px solid #000;padding:.55em .9em;margin:.8em 0;font-weight:700;font-size:1.02em}
.psheet h3{font-size:1.04em;font-weight:700;margin:1em 0 .35em;border-bottom:1px solid #000;padding-bottom:.2em}
.psheet ul{margin:0;padding-left:1.5em}
.psheet li{margin-bottom:.32em}
.psheet .val{font-weight:700}
.psheet p{margin:0 0 .35em}
.psheet .p2{font-size:1em;margin:0 0 .35em}
.psheet .withdoc{border-left:4px solid #000;padding:.6em .9em;margin:.85em 0;font-size:.96em;background:#f5f5f5}
.psheet .revline{margin-top:1.1em;padding-top:.5em;border-top:1px solid #000;font-size:.96em}
.psheet .disc{font-size:.82em;color:#333;margin-top:.5em;line-height:1.45}
.psheet .gen{font-size:.8em;color:#888;font-style:italic;font-weight:400}

@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff;height:auto;margin:0;padding:0}
  .noprint{display:none!important}
  .wrap{padding:0;margin:0;max-width:none}
  #sheet{margin:0}
  /* EXACTLY one A4 sheet. overflow hidden = ultimate failsafe against a 2nd page
     even if the size is nudged past the fit. */
  .psheet{width:210mm;height:297mm;overflow:hidden;margin:0;box-shadow:none;page-break-after:auto}
}
</style>
</head>
<body>
<div class="wrap">

<div id="gate" class="gate">
  <div class="masthead"><h1>Dispatch</h1></div>
  <div class="card">
    <label for="pass">Passcode</label>
    <input id="pass" type="password">
    <button style="margin-top:12px;width:100%" onclick="unlock()">Open</button>
    <p id="gerr" style="color:var(--red);font-size:13px"></p>
  </div>
</div>

<div id="app" style="display:none">
  <div class="masthead noprint"><h1>Dispatch board — today</h1></div>

  <div class="card noprint">
    <label>Add ref numbers to check (comma-separated), or leave blank for today's submitted refs</label>
    <div style="display:flex;gap:8px">
      <input id="refs" placeholder="2607133031, 2607131794">
      <button onclick="loadBoard()" style="flex:none">Refresh</button>
    </div>
    <table id="board"><thead><tr><th>Ref</th><th>Doctor</th><th>Dietician</th><th>Yoga</th><th>Status</th><th></th></tr></thead><tbody></tbody></table>
  </div>

  <div id="sheet"></div>
</div>
</div>

<script>
var API_URL='https://script.google.com/macros/s/AKfycbytFY4Kq1oFdJ0rkRMKVQMz7PEp_yAoOUq6wD_QvZrfEfdO0jhU0RSywBNVkbfkXh0/exec';
var $=function(id){return document.getElementById(id)};
var esc=function(s){return String(s||'').replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})};
var PASS='';

/* Support line — reaches the same qualified reviewers who read the report.
   No brand name is printed on the sheet; this is a plain contact number. */
var SUPPORT='97600 15878';

/* generic fallbacks when a role hasn't reviewed — NO name attached.
   Note: there is deliberately NO generic "chinta ki baat nahi" — that line
   only appears when a doctor actually reviewed. */
var GENERIC={
  questions:['Yeh values kis wajah se aisi hain?','Kya aur koi jaanch zaroori hai?','Agli baar poori jaanch kab karwani chahiye?'],
  diet:'Santulit khana khayein — sabziyan, dal, saabut anaj. Zyada tala-bhuna aur meetha kam karein. Paani theek matra mein piyein.',
  yoga:'Roz thodi walking ya halki stretching karein. Neend poori lein. Koi bhi bhaari abhyas shuru karne se pehle apne doctor se poochh lein.'
};

function unlock(){
  PASS=$('pass').value.trim();
  if(!PASS){$('gerr').textContent='Enter passcode.';return}
  $('gate').style.display='none';$('app').style.display='block';
  loadBoard();
}

function loadBoard(){
  fetch(API_URL+'?action=status&pass='+encodeURIComponent(PASS))
    .then(function(r){return r.json()}).then(function(res){
      if(!res.ok){alert('Error: '+res.error);return}
      var refs=Object.keys(res.status||{});
      var typed=$('refs').value.split(',').map(function(s){return s.trim()}).filter(Boolean);
      typed.forEach(function(r){if(refs.indexOf(r)<0)refs.push(r)});
      var tb=$('board').querySelector('tbody');tb.innerHTML='';
      if(!refs.length){tb.innerHTML='<tr><td colspan="6" class="n">No reviews submitted today yet.</td></tr>';return}
      refs.forEach(function(ref){
        var s=res.status[ref]||{doctor:false,dietician:false,yoga:false};
        var done=[s.doctor,s.dietician,s.yoga].filter(Boolean).length;
        var label=done===3?'Complete':done===0?'None — dispatch plain':done+' of 3';
        tb.innerHTML+='<tr><td class="ref">'+esc(ref)+'</td>'
          +cell(s.doctor)+cell(s.dietician)+cell(s.yoga)
          +'<td class="n">'+label+'</td>'
          +'<td>'+(done>0?'<button class="mkbtn" onclick="makeSheet(\''+esc(ref)+'\')">Make sheet</button>':'')+'</td></tr>';
      });
    }).catch(function(){alert('Network error.')});
}
function cell(on){return '<td><span class="dot '+(on?'on':'off')+'">'+(on?'✓':'–')+'</span></td>'}

function makeSheet(ref){
  fetch(API_URL+'?action=getReviews&ref='+encodeURIComponent(ref)+'&pass='+encodeURIComponent(PASS))
    .then(function(r){return r.json()}).then(function(res){
      if(!res.ok){alert('Error: '+res.error);return}
      renderSheet(res.report||{}, res.reviews||{});
    });
}

/* ===================== ONE-PAGE SHEET ===================== */
function renderSheet(rep, rv){
  var doc=rv.doctor?rv.doctor.data:null;
  var die=rv.dietician?rv.dietician.data:null;
  var yog=rv.yoga?rv.yoga.data:null;

  var flag = (doc && doc.triage==='priority')
    ? '<div class="flag">Yeh report '+esc(doc.window)+' din ke andar apne doctor ko dikhana zaroori hai.</div>' : '';

  var pr = doc && doc.primary && doc.primary.length
    ? '<h3>Sabse zaroori</h3><ul>'+doc.primary.map(function(p){return '<li><span class="val">'+esc(p[0])+'</span>'+(p[1]?' — '+esc(p[1]):'')+'</li>'}).join('')+'</ul>' : '';
  var se = doc && doc.secondary && doc.secondary.length
    ? '<h3>Dhyan rakhne wali</h3><ul>'+doc.secondary.map(function(s){return '<li>'+esc(s)+'</li>'}).join('')+'</ul>' : '';

  /* "chinta ki baat nahi" ONLY when a doctor actually reviewed. Wrapped so the
     auto-fit can drop it first if an unusually heavy report won't otherwise fit. */
  var normalBlock = (doc && doc.normal)
    ? '<div id="chintaBlock"><h3>Chinta ki baat nahi</h3><p>'+esc(doc.normal)+'</p></div>' : '';

  /* questions: doctor's if present, else general; capped at 4, placed after Dincharya */
  var qsrc = (doc && doc.questions && doc.questions.length) ? doc.questions : GENERIC.questions;
  var qGen = !(doc && doc.questions && doc.questions.length);
  var qs = qsrc.slice(0,4);
  var qHtml='<h3>Apne doctor se poochhein '+(qGen?'<span class="gen">(general)</span>':'')+'</h3><ul>'
    +qs.map(function(q){return '<li>'+esc(q)+'</li>'}).join('')+'</ul>';

  var dietTxt = die && die.diet ? die.diet : GENERIC.diet;
  var dietGen = !(die && die.diet);
  var yogaTxt = yog && yog.yoga ? yog.yoga : GENERIC.yoga;
  var yogaGen = !(yog && yog.yoga);
  /* keep full text so the cap lever (last resort) can trim/restore without a reload */
  window.__diet={full:dietTxt};
  window.__yoga={full:yogaTxt};

  var names=[];
  if(rv.doctor && rv.doctor.reviewer) names.push(esc(rv.doctor.reviewer)+' (Doctor)');
  if(rv.dietician && rv.dietician.reviewer) names.push(esc(rv.dietician.reviewer)+' (Dietician)');
  if(rv.yoga && rv.yoga.reviewer) names.push(esc(rv.yoga.reviewer)+' (Yoga Therapist)');

  var sheetHtml=
   '<div class="psheet" id="psheet"><div class="reserved"></div><div class="body">'
   +'<div class="title">AAPKI REPORT — AASAN BHASHA MEIN</div>'
   +'<div class="subtitle">Ek qualified doctor aur 2 health experts ne aapki report khud dekhkar samjhaayi hai</div>'
   +'<div class="ident">Ref No.: '+esc(rep.Ref||'')+' &nbsp;&middot;&nbsp; Age/Sex: '+esc(rep.Age||'')+' / '+esc(rep.Sex||'')
     +' &nbsp;&middot;&nbsp; Profile: '+esc(rep.Profile||'')+' &nbsp;&middot;&nbsp; Name: '+esc(rep.Patient||'')+'</div>'
   +flag+pr+se+normalBlock
   +'<h3>Khane mein '+(dietGen?'<span class="gen">(general)</span>':'')+'</h3><p class="p2" id="dietP">'+esc(dietTxt)+'</p>'
   +'<h3>Dincharya mein '+(yogaGen?'<span class="gen">(general)</span>':'')+'</h3><p class="p2" id="yogaP">'+esc(yogaTxt)+'</p>'
   +qHtml
   +'<div class="withdoc"><b>Baat karni hai?</b> Is report ko dekhne wale qualified doctor aur health experts se seedhe baat karne ke liye: '
     +'<b>'+esc(SUPPORT)+'</b>. Yeh koi automatic ya AI service nahi — asli qualified log.</div>'
   +'<div class="revline">'+(names.length?'Review by: '+names.join(' &nbsp; '):'')+'</div>'
   +'<div class="disc">Yeh diagnosis nahi hai. Ilaaj ka faisla hamesha aapke doctor ka hoga. '
     +'Is report ko dekhne wale medical experts ek independent clinical review team ki tarah kaam karte hain — '
     +'hamara dhyan sirf aapki report ke data ko sahi tareeke se samajhne par hota hai, aur salah dene mein hum '
     +'kisi bhi dawai ya diagnostic lab se poori tarah swatantra (independent) hain. Aapki jaankari private rehti hai.</div>'
   +'</div></div>';

  $('sheet').innerHTML=
     '<div class="noprint" style="text-align:center;margin:16px 0">'
       +'<button onclick="window.print()">Print / Save PDF</button>'
       +'<span style="margin-left:12px;color:var(--muted);font-size:13px">Prints as 1 A4 page on report stock. In print dialog, uncheck "Headers and footers".</span>'
     +'</div>'
     +'<div class="fitbar noprint">'
       +'<span class="fl">Text size</span>'
       +'<button type="button" class="fb" onclick="nudgeSize(-0.5)">−</button>'
       +'<input type="range" id="fsize" min="10" max="24" step="0.5" oninput="setSize(this.value)">'
       +'<button type="button" class="fb" onclick="nudgeSize(0.5)">+</button>'
       +'<span id="fsval" class="fl mono">—</span>'
       +'<button type="button" class="ghost fb2" onclick="autoFitSheet()">Optimum</button>'
       +'<span id="fitmsg" class="fl"></span>'
     +'</div>'
     +sheetHtml;

  autoFitSheet();
  $('sheet').scrollIntoView({behavior:'smooth'});
}

/* ===================== AUTO-FIT + MANUAL CONTROL ===================== */
var MMPX=96/25.4;                 /* CSS px per mm at 96dpi */
var PAGE_PX=297*MMPX;             /* full A4 height */
var SAFETY_MM=3;                  /* leave a hair of slack below the sheet box */
var AVAIL_PX=(297-SAFETY_MM)*MMPX;
var CEIL=18, FLOOR=12;            /* auto size stays legible; manual slider goes 10–24 */

function sheetEl(){return $('psheet')}
function fitsAt(px){var s=sheetEl();if(!s)return true;s.style.fontSize=px+'px';return s.offsetHeight<=AVAIL_PX}
function setChinta(show){var c=$('chintaBlock');if(c)c.style.display=show?'':'none'}
function capText(t){
  var CAP=420;if(t.length<=CAP)return t;
  var cut=t.slice(0,CAP),st=Math.max(cut.lastIndexOf('. '),cut.lastIndexOf('।'),cut.lastIndexOf(', '));
  if(st>CAP*0.6)cut=t.slice(0,st+1);
  return cut.trim()+' …';
}
function setCap(on){
  var d=$('dietP'),y=$('yogaP');
  if(d)d.innerHTML=esc(on?capText(window.__diet.full):window.__diet.full);
  if(y)y.innerHTML=esc(on?capText(window.__yoga.full):window.__yoga.full);
}
function searchSize(){
  var lo=FLOOR,hi=CEIL,best=FLOOR;fitsAt(FLOOR);
  for(var i=0;i<16;i++){var m=(lo+hi)/2;if(fitsAt(m)){best=m;lo=m}else hi=m}
  return best;
}
/* fill the page with the largest legible size; if a very heavy report still
   won't fit at the floor, drop "Chinta ki baat nahi", then trim the reviews. */
function autoFitSheet(){
  if(!sheetEl())return;
  setChinta(true);setCap(false);
  var b=searchSize();
  if(!fitsAt(FLOOR)){ setChinta(false); b=searchSize(); }
  if(!fitsAt(FLOOR)){ setCap(true);     b=searchSize(); }
  applySize(b,true);
}
function applySize(px,isAuto){
  var s=sheetEl();if(!s)return;
  px=Math.max(10,Math.min(24,Math.round(px*2)/2));
  s.style.fontSize=px+'px';
  var sl=$('fsize');if(sl)sl.value=px;
  var lbl=$('fsval');if(lbl)lbl.textContent=px.toFixed(1)+'px'+(isAuto?' · optimum':'');
  updateFit();
}
function setSize(v){applySize(parseFloat(v),false)}
function nudgeSize(d){var sl=$('fsize');if(sl)applySize(parseFloat(sl.value)+d,false)}
function updateFit(){
  var s=sheetEl(),m=$('fitmsg');if(!s||!m)return;
  var over=s.offsetHeight>PAGE_PX+1;
  m.textContent=over?'⚠ 1 page se zyada — print par neeche cut ho sakta hai':'✓ fits 1 page';
  m.style.color=over?'var(--red)':'var(--ok)';
}
</script>
</body>
</html>
